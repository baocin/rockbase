name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build and publish (e.g. v0.1.0)"
        required: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      # One platform failing must not withhold the binaries that did build.
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,  target: x86_64-unknown-linux-gnu,   ext: "" }
          # musl is statically linked: runs on Alpine and FROM scratch images.
          - { os: ubuntu-latest,  target: x86_64-unknown-linux-musl,  ext: "" }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu, ext: "" }
          - { os: macos-latest,   target: aarch64-apple-darwin,       ext: "" }
          # Cross-compiled on Apple Silicon rather than pinned to macos-13: that
          # runner class is being retired and jobs sit queued for hours. The macOS
          # SDK is universal and clang takes -arch, so cc builds bundled SQLite fine.
          - { os: macos-latest,   target: x86_64-apple-darwin,        ext: "" }
          - { os: windows-latest, target: x86_64-pc-windows-msvc,     ext: ".exe" }
    steps:
      # workflow_dispatch checks out the DEFAULT BRANCH unless told otherwise, which
      # would publish binaries built from main under whatever tag was requested —
      # artifacts that do not match the commit they claim to be.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      # rusqlite "bundled" compiles SQLite from C, so the musl target needs a
      # musl-capable C compiler; without this the cc crate fails to link.
      - name: Install musl toolchain
        if: endsWith(matrix.target, '-musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - run: cargo build --release --target ${{ matrix.target }}

      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          BIN="target/${{ matrix.target }}/release/rockbase${{ matrix.ext }}"
          test -x "$BIN" || { echo "binary missing: $BIN"; exit 1; }
          NAME="rockbase-${{ matrix.target }}"
          mkdir -p "dist/$NAME"
          cp "$BIN" "dist/$NAME/"
          cp README.md LICENSE "dist/$NAME/"
          cd dist
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            7z a "$NAME.zip" "$NAME" >/dev/null
          else
            tar czf "$NAME.tar.gz" "$NAME"
          fi
          # Checksums travel with the archive so a download can be verified.
          for f in "$NAME".*; do
            if command -v sha256sum >/dev/null; then sha256sum "$f" > "$f.sha256";
            else shasum -a 256 "$f" > "$f.sha256"; fi
          done

      - uses: actions/upload-artifact@v4
        with:
          name: rockbase-${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.sha256
          if-no-files-found: error

  publish:
    name: publish release
    needs: build
    # `needs` alone SKIPS this job if any matrix leg fails, which would contradict
    # fail-fast: false above — one unavailable runner class (macos-13 is being
    # retired) would withhold every binary that did build. Run regardless and
    # publish whatever artifacts exist; only bail if literally nothing built.
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          ls -la dist
          if [ -z "$(ls -A dist 2>/dev/null)" ]; then
            echo "no artifacts built for any target"; exit 1
          fi
          gh release create "$TAG" dist/* \
            --repo "${{ github.repository }}" \
            --title "rockbase $TAG" \
            --generate-notes
